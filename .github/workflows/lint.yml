name: Lint

on:
  push:
  pull_request:

jobs:
  python:
    name: Python (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements_test.txt
      - name: Run ruff
        run: ruff check custom_components/quizify
      - name: Run pytest
        run: pytest tests/ -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: custom_components/quizify/frontend
        run: npm ci
      - name: Build
        working-directory: custom_components/quizify/frontend
        run: npm run build
